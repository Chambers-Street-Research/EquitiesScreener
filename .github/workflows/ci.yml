name: CI

# PR feedback ONLY - runs tests and builds the image for every pull request.
# Pushes to main are handled by the publish workflow (publish.yml), which runs
# the same test gate and ships the image; running CI here too would test and
# build everything twice on every main commit.
#
# PR-RCE posture: `pull_request` runs untrusted PR code with NO repository
# secrets and a read-only token (see permissions below), so a malicious PR
# cannot exfiltrate secrets or write to the repo.
on:
  pull_request:

# Least privilege: this workflow only reads the repo - it never pushes back.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR when a newer push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: build the builder -> test stages and run the gtest suites.
  # vcpkg installs and dependency builds are cached via the GitHub Actions
  # cache (type=gha), so they only run once per baseline change.
  test:
    name: Unit tests (GoogleTest, statically linked)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Build-only job: never git-push, so don't leave the token in
          # .git/config where a compromised step could exfiltrate it.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run tests
        uses: docker/build-push-action@v6
        with:
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ship the runtime image. `needs: test` means a failing test blocks the
  # image build; the full build also re-runs the test stage as a gate.
  image:
    name: Build runtime image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: equities-screener:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm equities-screener --help
