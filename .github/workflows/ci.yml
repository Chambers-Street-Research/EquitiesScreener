name: CI

# Push to the default branch plus every pull request.
on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: this workflow only reads the repo - it never pushes back.
# The `type=gha` build cache authenticates via the runner's ephemeral runtime
# token ($ACTIONS_RUNTIME_TOKEN/$ACTIONS_RESULTS_URL), NOT via this token's
# scopes, so a restricted permissions block does not disable caching.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR when a newer push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: build the builder -> test stages and run the gtest suites.
  # vcpkg installs and dependency builds are cached via the GitHub Actions
  # cache (type=gha), so they only run once per baseline change.
  test:
    name: Unit tests (GoogleTest, statically linked)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # All third-party actions are pinned to full commit SHAs (immutable)
      # with the release version as a comment; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build-only job: never git-push, so don't leave the token in
          # .git/config where a compromised step could exfiltrate it.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and run tests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ship the runtime image. `needs: test` means a failing test blocks the
  # image build; the full build also re-runs the test stage as a gate.
  image:
    name: Build runtime image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and load image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          load: true
          tags: equities-screener:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm equities-screener --help
