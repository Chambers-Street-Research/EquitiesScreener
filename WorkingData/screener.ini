# Base screener configuration - works out of the box with sample.csv.
# Run `EquitiesScreener` (no arguments) from this directory and it is
# auto-loaded. See screener.ini.example for the fully annotated reference.

input = sample.csv

[screen:value]
# Classic value screen: reasonable P/E, solid ROE, manageable debt.
filter = PE:0:30
filter = ROE:0.15:
filter = EVEBITDA::20
sort = ROE:desc
output = value_screened.csv

[screen:growth]
# Growth screen: strong return on invested capital.
filter = ROIC:0.25:
sort = ROIC:asc
# No output = line: auto-named growth_screened.csv
